name: Filter changed paths
description: Set matched=true if any changed pull request file matches the given regular expressions.

inputs:
  patterns:
    description: Newline-separated regular expressions tested against changed file paths.
    required: true
  github-token:
    description: Token used to list pull request files.
    required: false
    default: ${{ github.token }}

outputs:
  matched:
    description: Whether any changed file matched a pattern (always true for non-PR events).
    value: ${{ steps.filter.outputs.matched }}

runs:
  using: composite
  steps:
    - name: Match changed paths
      id: filter
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          if (!['pull_request', 'pull_request_target'].includes(context.eventName)) {
            core.setOutput('matched', 'true');
            return;
          }

          const regexes = ${{ toJSON(inputs.patterns) }}
            .trim()
            .split('\n')
            .map((line) => line.trim())
            .map((pattern) => new RegExp(pattern));

          const files = await github.paginate(github.rest.pulls.listFiles, {
            ...context.repo,
            pull_number: context.payload.pull_request.number,
          });

          // Match new path, and old path if exists (in case a file was renamed).
          const matched = files.some((file) =>
            regexes.some((re) => re.test(file.filename) || (file.previous_filename && re.test(file.previous_filename)))
          );

          core.setOutput('matched', String(matched));
